databases:
- name: nexus-db
  plan: free
  databaseName: nexus
  user: nexus
services:
- type: web
  name: nexus-api
  plan: free
  env: docker
  dockerfilePath: backend/Dockerfile
  dockerContext: backend
  healthCheckPath: /api/health
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: nexus-db
      property: connectionString
  - key: OPENAI_API_KEY
    sync: false
  - key: GITHUB_CLIENT_ID
    sync: false
  - key: GITHUB_CLIENT_SECRET
    sync: false
  - key: AES_SECRET_KEY
    generateValue: true
