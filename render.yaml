databases:
  - name: nexus-db
    databaseName: nexus
    user: nexus

services:
  - type: pserv
    name: redis
    env: docker
    image: redis:7-alpine
    disk:
      name: redis-data
      mountPath: /data
      sizeGB: 1
    dockerCommand: redis-server --requirepass $REDIS_PASSWORD --appendonly yes
    envVars:
      - key: REDIS_PASSWORD
        generateValue: true

  - type: pserv
    name: qdrant
    env: docker
    image: qdrant/qdrant:latest
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 1

  - type: web
    name: nexus-api
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        value: redis://:${REDIS_PASSWORD}@redis:6379/0
      - key: REDIS_PASSWORD
        fromService:
          type: pserv
          name: redis
          envVarKey: REDIS_PASSWORD
      - key: QDRANT_URL
        value: http://qdrant:6333
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: AES_SECRET_KEY
        generateValue: true

  - type: worker
    name: nexus-worker
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    dockerCommand: celery -A ingestion_worker.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        value: redis://:${REDIS_PASSWORD}@redis:6379/0
      - key: REDIS_PASSWORD
        fromService:
          type: pserv
          name: redis
          envVarKey: REDIS_PASSWORD
      - key: QDRANT_URL
        value: http://qdrant:6333
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: AES_SECRET_KEY
        fromService:
          type: web
          name: nexus-api
          envVarKey: AES_SECRET_KEY

  - type: worker
    name: nexus-beat
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    dockerCommand: celery -A ingestion_worker.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        value: redis://:${REDIS_PASSWORD}@redis:6379/0
      - key: REDIS_PASSWORD
        fromService:
          type: pserv
          name: redis
          envVarKey: REDIS_PASSWORD

