version: '3.9'
networks:
  nexus_internal:
    driver: bridge
  nexus_public:
    driver: bridge
volumes:
  postgres_data: null
  prometheus_data: null
  grafana_data: null
x-api-env:
  DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
  AES_SECRET_KEY: ${AES_SECRET_KEY}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  EMBED_PROVIDER: ${EMBED_PROVIDER:-openai}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-coder:6.7b}
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
    - 5432:5432
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - nexus_internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U nexus -d nexus
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-coder:6.7b}
      PYTHONUNBUFFERED: '1'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - nexus_internal
    - nexus_public
    ports:
    - 8000:8000
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    command: 'uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2 --loop uvloop
      --no-access-log

      '
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
    - nexus_public
    ports:
    - 3000:3000
    depends_on:
    - api
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000
      interval: 30s
      timeout: 10s
      retries: 3
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
    - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    networks:
    - nexus_internal
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.enable-lifecycle
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
    volumes:
    - grafana_data:/var/lib/grafana
    - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
    - nexus_internal
    - nexus_public
    ports:
    - 3001:3000
    depends_on:
    - prometheus
