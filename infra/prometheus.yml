global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: nexus-prod

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: nexus-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis:9121"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres:9187"]

  - job_name: celery-flower
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: /metrics
